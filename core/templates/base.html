<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  {% block title%} {% endblock%} </title>
    {% block extra_css%}
    {% endblock%}

</head>
<body>
    {% if messages%}
        {% for message in messages%}
            <div>
                {{message}}
            </div>
        {% endfor %}
    {% endif %}
    <main>
        {% block content%}
        {% endblock %}
    </main>
</body>
</html>
