{% extends 'base.html'%}
{% block title%}
لیست آیتم ها
{%endblock%}

{% block content%}
<form method="get">
    <input type="text" name="q" placeholder="جست‌وجو..." value="{{request.GET.q}}">
    <select name="status">
        <option value="">
            همه وضعیت ها
        </option>

        <option value="open" {% if request.GET.status == "open" %} selected {% endif %}>
            باز
        </option>

        <option value="closed" {% if request.GET.status == "closed" %} selected {% endif %}>
             بسته
        </option>

    </select>
    <input type="number" name="category" placeholder="دسته بندی"value="{{request.GET.category}}">

    <button type="submit">search</button>
</form>

<form method="get" class="filters">
    <label>از تاریخ
        <input type="date" name="start_date" value="{{ start_date|default:'' }}">
    </label>
    <label>تا تاریخ
        <input type="date" name="end_date" value="{{ end_date|default:'' }}">
    </label>
    
  <button type="submit">اعمال فیلتر</button>
  <a href="/item/list">حذف فیلتر</a>
</form>
{% for item in items %}

    <h3>{{item.title}}</h3>
    <p> {{item.location}}</p>
    <hr>
{% empty %}
    <p>هیچ آیتمی در کل سیستم وجود ندارد</p>
{% endfor %}
{% endblock%}
